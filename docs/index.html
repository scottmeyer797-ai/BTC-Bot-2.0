<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BREAKOUT//BOT — BloFin demo</title>
<style>
:root{
  --bg:#05020d;--bg2:#0b0618;--panel:rgba(18,8,38,.78);--line:#2a1550;
  --pink:#ff2bd6;--cyan:#00f0ff;--yellow:#f6ff3d;--green:#39ff88;--red:#ff3b5c;--violet:#9d4dff;
  --text:#e8e6ff;--dim:#8b84b8;--mono:"JetBrains Mono","Fira Code","Cascadia Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px}
body{min-height:100vh;
  background:
    radial-gradient(1200px 600px at 10% -10%,rgba(255,43,214,.16),transparent 60%),
    radial-gradient(900px 500px at 110% 10%,rgba(0,240,255,.13),transparent 60%),
    linear-gradient(rgba(157,77,255,.07) 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,rgba(157,77,255,.07) 1px,transparent 1px) 0 0/32px 100%,
    var(--bg);}
body:after{content:"";pointer-events:none;position:fixed;inset:0;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
a{color:var(--cyan)}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{font-size:28px;font-weight:800;letter-spacing:.08em;position:relative;color:#fff;
  text-shadow:0 0 8px var(--pink),0 0 22px rgba(255,43,214,.6)}
.logo span{color:var(--cyan);text-shadow:0 0 8px var(--cyan),0 0 22px rgba(0,240,255,.6)}
.logo:before,.logo:after{content:attr(data-text);position:absolute;left:0;top:0;opacity:.55;pointer-events:none}
.logo:before{color:var(--cyan);transform:translate(2px,0);clip-path:inset(0 0 60% 0);animation:gl 3.2s infinite steps(2)}
.logo:after{color:var(--pink);transform:translate(-2px,0);clip-path:inset(55% 0 0 0);animation:gl 2.7s infinite steps(2) reverse}
@keyframes gl{0%,92%{transform:translate(0,0)}93%{transform:translate(3px,-1px)}96%{transform:translate(-3px,1px)}100%{transform:translate(0,0)}}
.sub{color:var(--dim);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:rgba(11,6,24,.85);padding:5px 9px;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.chip.ok{border-color:var(--green);color:var(--green);box-shadow:0 0 10px rgba(57,255,136,.25) inset}
.chip.warn{border-color:var(--yellow);color:var(--yellow)}
.chip.bad{border-color:var(--red);color:var(--red);box-shadow:0 0 14px rgba(255,59,92,.4) inset}
.chip.info{border-color:var(--cyan);color:var(--cyan)}
.chip.pink{border-color:var(--pink);color:var(--pink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;
  box-shadow:0 0 8px var(--green);animation:pulse 1.4s infinite}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
@keyframes pulse{50%{opacity:.25}}
.banner{border:1px solid var(--yellow);color:var(--yellow);padding:8px 12px;margin-bottom:14px;display:none;
  background:repeating-linear-gradient(45deg,rgba(246,255,61,.08) 0 12px,transparent 12px 24px)}
.banner.bad{border-color:var(--red);color:var(--red);background:repeating-linear-gradient(45deg,rgba(255,59,92,.1) 0 12px,transparent 12px 24px)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);position:relative;padding:14px;backdrop-filter:blur(3px);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.panel:before{content:"";position:absolute;left:0;top:0;width:40%;height:2px;background:linear-gradient(90deg,var(--pink),transparent)}
.panel h2{margin:0 0 10px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:700}
.kpi .label{color:var(--dim);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.kpi .val{font-size:24px;font-weight:800;margin-top:6px;white-space:nowrap}
.kpi .note{color:var(--dim);font-size:11px;margin-top:4px;min-height:14px}
.pos{color:var(--green);text-shadow:0 0 10px rgba(57,255,136,.35)}
.neg{color:var(--red);text-shadow:0 0 10px rgba(255,59,92,.35)}
.neu{color:var(--text)}
.bar{height:7px;background:#1a0f33;margin-top:8px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 10px var(--pink)}
.bar i.hot{background:linear-gradient(90deg,var(--yellow),var(--red))}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);margin-top:12px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
#chart{width:100%;height:260px;position:relative}
#chart svg{width:100%;height:100%;display:block}
.tip{position:absolute;pointer-events:none;background:#0b0618;border:1px solid var(--cyan);padding:6px 8px;font-size:11px;
  display:none;white-space:nowrap;box-shadow:0 0 12px rgba(0,240,255,.35);z-index:5}
.empty{color:var(--dim);padding:18px 4px;text-align:center;letter-spacing:.1em}
.cards{display:grid;gap:10px}
.card{border:1px solid var(--line);padding:10px;background:rgba(5,2,13,.6)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sym{font-size:16px;font-weight:800;letter-spacing:.06em}
.side{font-size:10px;padding:2px 6px;border:1px solid;margin-left:6px}
.side.long{color:var(--green);border-color:var(--green)}
.side.short{color:var(--red);border-color:var(--red)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 12px;margin-top:8px;font-size:11px}
.kv div span{display:block;color:var(--dim);font-size:9px;letter-spacing:.16em;text-transform:uppercase}
.track{position:relative;height:10px;margin:12px 0 4px;background:linear-gradient(90deg,rgba(255,59,92,.35),rgba(26,15,51,1) 30%,rgba(26,15,51,1) 70%,rgba(57,255,136,.35))}
.track b{position:absolute;top:-4px;width:2px;height:18px;background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.track u{position:absolute;top:-3px;width:1px;height:16px;background:var(--cyan);opacity:.8}
.track .lbl{position:absolute;top:13px;font-size:9px;color:var(--dim);transform:translateX(-50%);white-space:nowrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:9px;letter-spacing:.12em;padding:2px 6px;border:1px solid var(--violet);color:var(--violet);text-transform:uppercase}
.tag.on{border-color:var(--yellow);color:var(--yellow)}
.tabs{display:flex;gap:4px;margin:18px 0 0;flex-wrap:wrap}
.tab{background:transparent;color:var(--dim);border:1px solid var(--line);border-bottom:none;padding:8px 14px;cursor:pointer;
  font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;font-size:11px}
.tab.active{color:var(--pink);border-color:var(--pink);box-shadow:0 -6px 16px -8px var(--pink) inset;background:rgba(255,43,214,.06)}
.tabpanel{display:none;border-top:1px solid var(--pink)}
.tabpanel.active{display:block}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
input,select,button.btn{background:#0b0618;color:var(--text);border:1px solid var(--line);padding:7px 9px;font-family:var(--mono);font-size:12px}
input:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 8px rgba(0,240,255,.35)}
button.btn{cursor:pointer;color:var(--cyan);border-color:var(--cyan);letter-spacing:.1em;text-transform:uppercase;font-size:11px}
button.btn:hover{background:rgba(0,240,255,.1)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{color:var(--dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase;text-align:left;padding:8px;border-bottom:1px solid var(--line);
  cursor:pointer;white-space:nowrap;user-select:none}
th.sorted{color:var(--cyan)}
td{padding:7px 8px;border-bottom:1px solid rgba(42,21,80,.6);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(0,240,255,.06)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--dim)}
.totals{color:var(--dim);font-size:11px;margin:0 0 8px}
.totals b{color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(3,1,8,.82);display:none;z-index:40;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal.show{display:flex}
.modal .panel{max-width:960px;width:100%}
.close{float:right;cursor:pointer;color:var(--pink);font-size:12px;letter-spacing:.2em}
.timeline{border-left:2px solid var(--pink);margin:8px 0 8px 6px;padding-left:12px}
.timeline div{margin:0 0 8px;position:relative}
.timeline div:before{content:"";position:absolute;left:-18px;top:4px;width:10px;height:10px;background:var(--bg);border:2px solid var(--cyan)}
.timeline small{color:var(--dim)}
pre{white-space:pre-wrap;word-break:break-word;background:#07030f;border:1px solid var(--line);padding:10px;font-size:11px;max-height:420px;overflow:auto}
.flash{animation:flash 1.2s}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--cyan)}30%{box-shadow:0 0 30px 4px var(--cyan)}100%{box-shadow:none}}
footer{color:var(--dim);font-size:10px;letter-spacing:.12em;margin-top:24px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="logo" data-text="BREAKOUT//BOT">BREAKOUT<span>//</span>BOT</div>
      <div class="sub">BloFin demo · swing-level breakout · forward test</div>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <div class="banner" id="banner"></div>

  <section class="grid kpis" id="kpis"></section>

  <section class="grid two">
    <div class="panel" id="equity-panel">
      <h2>Equity curve</h2>
      <div id="chart"><div class="tip" id="tip"></div></div>
    </div>
    <div class="panel" id="open-panel">
      <h2>Open positions <span id="opencount" style="color:var(--dim)"></span></h2>
      <div class="cards" id="open"></div>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="history">Trade history</button>
    <button class="tab" data-tab="signals">Signals</button>
    <button class="tab" data-tab="events">Event log</button>
    <button class="tab" data-tab="system">System</button>
  </nav>

  <section class="panel tabpanel active" id="tab-history">
    <div class="filters">
      <input id="h-q" placeholder="search id, symbol, reason…" size="24">
      <select id="h-sym"><option value="">all symbols</option></select>
      <select id="h-side"><option value="">long + short</option><option>long</option><option>short</option></select>
      <select id="h-res"><option value="">all results</option><option value="win">winners</option><option value="loss">losers</option></select>
      <select id="h-reason"><option value="">all exit reasons</option></select>
      <input id="h-from" type="date" title="closed from"><input id="h-to" type="date" title="closed until">
      <button class="btn" id="h-csv">Export CSV</button>
    </div>
    <div class="totals" id="h-totals"></div>
    <div class="tablewrap"><table id="h-table"><thead></thead><tbody></tbody></table></div>
    <div class="pager" id="h-pager"></div>
  </section>

  <section class="panel tabpanel" id="tab-signals">
    <div class="filters">
      <input id="s-q" placeholder="search reason, symbol…" size="24">
      <select id="s-sym"><option value="">all symbols</option></select>
      <select id="s-act"><option value="">taken + skipped</option><option>taken</option><option>skipped</option><option value="dry_run">dry run</option></select>
      <button class="btn" id="s-csv">Export CSV</button>
    </div>
    <div class="totals" id="s-totals"></div>
    <div class="tablewrap"><table id="s-table"><thead></thead><tbody></tbody></table></div>
    <div class="pager" id="s-pager"></div>
  </section>

  <section class="panel tabpanel" id="tab-events">
    <div class="filters">
      <input id="e-q" placeholder="search details, trade id…" size="24">
      <select id="e-type"><option value="">all events</option></select>
      <button class="btn" id="e-csv">Export CSV</button>
    </div>
    <div class="totals" id="e-totals"></div>
    <div class="tablewrap"><table id="e-table"><thead></thead><tbody></tbody></table></div>
    <div class="pager" id="e-pager"></div>
  </section>

  <section class="panel tabpanel" id="tab-system">
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div><h2>Configuration</h2><div class="tablewrap"><table id="cfg"><tbody></tbody></table></div></div>
      <div><h2>Feeds</h2><div class="tablewrap"><table id="feeds"><tbody></tbody></table></div></div>
    </div>
    <h2 style="margin-top:16px">Last exchange self-test</h2>
    <pre id="selftest"></pre>
  </section>

  <footer id="footer"></footer>
</div>

<div class="modal" id="modal"><div class="panel" id="modal-body"></div></div>

<script>
"use strict";
// ---------------------------------------------------------------- helpers (data is always inserted as text)
const $ = (s) => document.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null) continue;
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false)
    e.appendChild(typeof k === "string" || typeof k === "number" ? document.createTextNode(String(k)) : k);
  return e;
}
const num = (x) => (x === null || x === undefined || x === "" || isNaN(+x)) ? null : +x;
const fmt = (x, d = 2) => x === null || x === undefined || isNaN(x) ? "—" : (+x).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const money = (x) => x === null || x === undefined ? "—" : (x < 0 ? "-$" : "$") + fmt(Math.abs(x));
const sgn = (x, d = 2) => x === null || x === undefined ? "—" : (x > 0 ? "+" : "") + fmt(x, d);
const pct = (x, d = 2) => x === null || x === undefined ? "—" : (x > 0 ? "+" : "") + fmt(x * 100, d) + "%";
const cls = (x) => x > 0 ? "pos" : x < 0 ? "neg" : "neu";
const px = (x) => { if (x === null || x === undefined) return "—"; const a = Math.abs(x);
  return (+x).toLocaleString("en-US", {maximumSignificantDigits: a >= 1000 ? 8 : 6}); };
const iso = (ms) => ms ? new Date(+ms).toISOString().replace("T", " ").slice(0, 16) : "—";
const ago = (t) => { if (!t) return "never"; const s = (Date.now() - new Date(t).getTime()) / 1000;
  if (s < 0) return "just now";
  if (s < 90) return Math.round(s) + "s ago"; if (s < 5400) return Math.round(s / 60) + " min ago";
  if (s < 172800) return (s / 3600).toFixed(1) + " h ago"; return (s / 86400).toFixed(1) + " d ago"; };
const safeUrl = (u) => /^https?:\/\//.test(u || "") ? u : null;

// ---------------------------------------------------------------- state
let DATA = null, PRICES = {}, PRICE_AT = null, PRICE_OK = false, lastGen = null;
const DATA_URL = "data.json";

async function loadData() {
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const changed = lastGen && d.generated_at !== lastGen;
    DATA = d; lastGen = d.generated_at;
    renderAll();
    if (changed) { $("#kpis").classList.remove("flash"); void $("#kpis").offsetWidth; $("#kpis").classList.add("flash"); }
  } catch (e) {
    showBanner("Can't load bot data (" + e.message + "). Retrying every minute.", true);
  }
}
async function loadPrices() {
  if (!DATA || DATA.preview) return;  // preview data uses simulated prices: never mix in real ones
  const base = safeUrl(DATA.exchange && DATA.exchange.rest);
  if (!base || !/demo-trading-openapi\.blofin\.com/.test(base)) return;
  try {
    const r = await fetch(base + "/api/v1/market/tickers", {cache: "no-store"});
    const j = await r.json();
    const m = {};
    for (const t of (j.data || [])) { const v = num(t.last); if (v) m[t.instId] = v; }
    PRICES = m; PRICE_AT = Date.now(); PRICE_OK = true;
  } catch (e) { PRICE_OK = false; }
  renderLive();
}

// ---------------------------------------------------------------- live maths
function liveTrade(t) {
  const p = PRICES[t.inst_id];
  const dir = t.side === "long" ? 1 : -1;
  const qty = (+t.contracts) * (+t.contract_value);
  if (!p) return {price: null, upnl: null, r: null};
  const upnl = dir * (p - t.entry_price) * qty - (t.entry_fee || 0);
  const r = t.risk_amount ? (upnl + (t.realized_added || 0)) / t.risk_amount : null;
  return {price: p, upnl, r};
}
function liveEquity() {
  const d = DATA; if (!d) return null;
  let unreal = 0, ok = true;
  for (const t of d.open_trades) { const l = liveTrade(t); if (l.upnl === null) ok = false; else unreal += l.upnl; }
  if (!ok || !PRICE_OK) return {equity: d.summary.equity, live: false, unreal: null};
  return {equity: d.bot.account_size + d.summary.realized_pnl + unreal, live: true, unreal};
}

// ---------------------------------------------------------------- header + KPIs
function showBanner(text, bad) { const b = $("#banner"); b.textContent = text; b.className = "banner" + (bad ? " bad" : ""); b.style.display = text ? "block" : "none"; }
function chip(text, kind, withDot, dotOff) { return el("span", {class: "chip " + (kind || "")}, withDot ? el("span", {class: "dot" + (dotOff ? " off" : "")}) : null, text); }

function renderHeader() {
  const d = DATA, b = d.bot, s = d.summary;
  const lastRun = s.last_run ? (Date.now() - new Date(s.last_run).getTime()) / 3600e3 : null;
  const stale = lastRun === null || lastRun > 5;
  const chips = $("#chips"); chips.replaceChildren(...[
    b.failed ? chip("challenge failed", "bad", true, true)
      : chip(stale ? "bot stale" : "bot online", stale ? "warn" : "ok", true, stale),
    chip(PRICE_OK ? "price feed live" : "price feed offline", PRICE_OK ? "info" : "warn", true, !PRICE_OK),
    chip(b.mode + " mode", "pink"), chip("exit " + b.exit_protocol, "info"),
    chip(b.long_only ? "long only" : "long + short"), chip("vol: " + b.volume_source),
    b.enabled ? null : chip("kill switch on", "bad"),
    el("span", {class: "chip", id: "clock"}, new Date().toISOString().slice(11, 19) + " UTC")].filter(Boolean));
  const msgs = [];
  if (d.preview) msgs.push("PREVIEW — simulated data from the test harness, not real trades.");
  if (b.failed) msgs.push("CHALLENGE FAILED: " + (b.failed_reason || "") + " (" + (b.failed_at || "") + ")");
  if (!b.failed && stale && s.last_run) msgs.push("No bot run for " + ago(s.last_run).replace(" ago", "") + ". Check the GitHub Actions workflow.");
  if (!s.last_run) msgs.push("Waiting for the bot's first live run.");
  if ((d.unmanaged_positions || []).length) msgs.push("Positions on the exchange that the bot did not open: " + d.unmanaged_positions.map(u => u.inst_id).join(", "));
  showBanner(msgs.join("  ·  "), b.failed);
}

function kpi(id, label, value, valueClass, note, barFrac, hot) {
  return el("div", {class: "panel kpi", id},
    el("div", {class: "label"}, label), el("div", {class: "val " + (valueClass || "")}, value),
    el("div", {class: "note"}, note || ""),
    barFrac === undefined ? null : el("div", {class: "bar"}, el("i", {class: hot ? "hot" : "", style: "width:" + Math.max(0, Math.min(100, barFrac * 100)) + "%"})));
}

function renderKpis() {
  const d = DATA, b = d.bot, s = d.summary, live = liveEquity();
  const eq = live.equity, ret = eq / b.account_size - 1;
  const today = new Date().toISOString().slice(0, 10);
  const dayStart = (s.day_start_equity || {})[today] || null;
  const dayPnl = dayStart ? eq - dayStart : null;
  const dayLoss = dayStart ? Math.max(0, dayStart - eq) / dayStart : 0;
  const dd = Math.max(0, b.account_size - eq) / b.account_size;
  const risk = b.risk_pct * (b.consecutive_losses >= 3 ? 0.5 : 1);
  $("#kpis").replaceChildren(
    kpi("k-eq", live.live ? "Equity · live" : "Equity · last run", money(eq), cls(ret), pct(ret) + " vs " + money(b.account_size)),
    kpi("k-day", "Today's P&L", dayPnl === null ? "—" : (dayPnl >= 0 ? "+" : "") + money(dayPnl), cls(dayPnl),
        "daily loss " + fmt(dayLoss * 100) + "% of " + fmt(b.daily_loss_limit * 100, 0) + "% limit", dayLoss / b.daily_loss_limit, dayLoss / b.daily_loss_limit > .6),
    kpi("k-dd", "Drawdown from start", fmt(dd * 100) + "%", dd > 0 ? "neg" : "neu",
        "limit " + fmt(b.max_drawdown_limit * 100, 0) + "% · peak-to-trough " + fmt((s.max_drawdown || 0) * 100) + "%", dd / b.max_drawdown_limit, dd / b.max_drawdown_limit > .6),
    kpi("k-win", "Win rate", s.win_rate === null ? "—" : fmt(s.win_rate * 100, 1) + "%", "neu", s.closed_trades + " closed · " + s.open_trades + " open"),

  [["0%", "rgba(255,43,214,.45)"], ["100%", "rgba(255,43,214,0)"]].forEach(([o, c]) => { const s = document.createElementNS(NS, "stop"); s.setAttribute("offset", o); s.setAttribute("stop-color", c); g.appendChild(s); });

    const t = mk("text", {x: L - 6, y: y + 3, "text-anchor": "end", fill: "#8b84b8", "font-size": 10}); t.textContent = "$" + Math.round(v).toLocaleString(); }
  const base = Y(DATA.bot.account_size);

  const ddY = Y(DATA.bot.account_size * (1 - DATA.bot.max_drawdown_limit));

  const line = pts.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  mk("path", {d: line + ` L${X(pts[pts.length - 1].t)} ${H - B} L${X(pts[0].t)} ${H - B} Z`, fill: "url(#fill)"});
  mk("path", {d: line, fill: "none", stroke: "#ff2bd6", "stroke-width": 2, style: "filter:drop-shadow(0 0 6px #ff2bd6)"});
  [x0, (x0 + x1) / 2, x1].forEach((t, i) => { const tx = mk("text", {x: X(t), y: H - 8, "text-anchor": ["start", "middle", "end"][i], fill: "#8b84b8", "font-size": 10}); tx.textContent = new Date(t).toISOString().slice(0, 10); });
  const cur = mk("circle", {r: 4, fill: "#00f0ff", style: "display:none;filter:drop-shadow(0 0 6px #00f0ff)"});
  svg.addEventListener("mousemove", (ev) => {

function makeTable(cfg) {
  const st = {sort: cfg.sort, dir: cfg.dir || -1, page: 0};

  const b = DATA.bot;
  const rows = [["mode", b.mode], ["account size", money(b.account_size)], ["risk per trade", fmt(b.risk_pct * 100) + "%"],
    ["target", b.target_r + "R"], ["max open risk", fmt(b.max_open_risk * 100) + "%"], ["exit plan", b.exit_protocol + " — " + b.exit_description],
    ["direction", b.long_only ? "long only" : "long + short"], ["volume source", b.volume_source],
    ["daily loss limit", fmt(b.daily_loss_limit * 100) + "% (new trades blocked at " + fmt(b.daily_block * 100, 1) + "%)"],
    ["max drawdown", fmt(b.max_drawdown_limit * 100) + "% (blocked at " + fmt(b.drawdown_block * 100, 0) + "%)"],
    ["trading enabled", b.enabled ? "yes" : "NO — kill switch"], ["challenge failed", b.failed ? "YES — " + b.failed_reason : "no"]];
  $("#cfg tbody").replaceChildren(...rows.map(([k, v]) => el("tr", null, el("td", {style: "color:var(--dim)"}, k), el("td", null, v))));
  $("#feeds tbody").replaceChildren(
    el("tr", null, el("td", {style: "color:var(--dim)"}, "bot data generated"), el("td", null, (DATA.generated_at || "") + " (" + ago(DATA.generated_at) + ")")),
    el("tr", null, el("td", {style: "color:var(--dim)"}, "dashboard refresh"), el("td", null, "data every 60 s · prices every 10 s")),
    el("tr", null, el("td", {style: "color:var(--dim)"}, "price feed"), el("td", null, PRICE_OK ? "BloFin demo tickers, " + ago(new Date(PRICE_AT).toISOString()) : "offline")),
    el("tr", null, el("td", {style: "color:var(--dim)"}, "exchange"), el("td", null, DATA.exchange.name + " · " + DATA.exchange.rest)));
  $("#selftest").textContent = DATA.selftest || "No self-test recorded yet.";
}

// ---------------------------------------------------------------- render loop
function renderLive() { if (!DATA) return; renderHeader(); renderKpis(); renderOpen(); renderChart(); renderSystem(); }
function renderAll() {
  if (!DATA) return;
  fillSelect("#h-sym", DATA.closed_trades.map(t => t.symbol), "all symbols");
  fillSelect("#h-reason", DATA.closed_trades.map(t => t.exit_reason), "all exit reasons");
  fillSelect("#s-sym", DATA.signals.map(s => s.symbol), "all symbols");
  fillSelect("#e-type", DATA.events.map(e => e.event), "all events");
  renderLive(); H.render(); S.render(); E.render();
  $("#footer").textContent = "BloFin DEMO only · data " + (DATA.generated_at || "") + " · " + DATA.closed_trades.length + " closed trades · " + (DATA.signals || []).length + " signals · " + (DATA.events || []).length + " events";
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === b));
  document.querySelectorAll(".tabpanel").forEach(p => p.classList.toggle("active", p.id === "tab-" + b.dataset.tab));
}));
window.addEventListener("resize", () => DATA && renderChart());
setInterval(() => { const c = $("#clock"); if (c) c.textContent = new Date().toISOString().slice(11, 19) + " UTC"; }, 1000);
loadData().then(loadPrices);
setInterval(loadData, 60000);
setInterval(loadPrices, 10000);
</script>
</body>
</html>
